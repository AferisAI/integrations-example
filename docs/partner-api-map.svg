<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa da API do parceiro AferisAI</title>
  <desc id="desc">Painel configura a aplicação, OAuth entrega um token delegado e o token acessa pedidos, pagamentos e webhooks com escopos separados.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#e8eef8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#3d70e8"/></marker></defs>
  <style>.box{fill:#fff;stroke:#cbd6e6;stroke-width:2;rx:18;filter:url(#shadow)}.title{font:700 22px Inter,Arial,sans-serif;fill:#17233b}.text{font:500 16px Inter,Arial,sans-serif;fill:#40516d}.small{font:600 14px Inter,Arial,sans-serif;fill:#64748b}.line{stroke:#3d70e8;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1400" height="900" fill="url(#bg)"/><text x="70" y="70" class="title" font-size="30">AferisAI · acesso do parceiro</text><text x="70" y="102" class="text">Uma conta pode autorizar várias aplicações; cada aplicação recebe apenas os escopos aprovados.</text>
  <rect x="70" y="155" width="280" height="205" class="box"/><text x="98" y="198" class="title">1 · Painel</text><text x="98" y="232" class="text">Aplicação, redirects,</text><text x="98" y="257" class="text">permissões, credenciais</text><text x="98" y="282" class="text">e webhooks.</text><text x="98" y="322" class="small">Sessão humana do parceiro</text>
  <rect x="415" y="155" width="300" height="205" class="box"/><text x="443" y="198" class="title">2 · OAuth + PKCE</text><text x="443" y="232" class="text">/oauth/authorize</text><text x="443" y="257" class="text">/oauth/token</text><text x="443" y="282" class="text">state + code_challenge</text><text x="443" y="322" class="small">Titular aprova a conexão</text>
  <rect x="780" y="155" width="310" height="205" class="box"/><text x="808" y="198" class="title">3 · Token delegado</text><text x="808" y="232" class="text">Bearer + escopos</text><text x="808" y="257" class="text">application_id</text><text x="808" y="282" class="text">connection_id</text><text x="808" y="322" class="small">Validação em cada request</text>
  <rect x="70" y="470" width="330" height="250" class="box"/><text x="98" y="514" class="title">4 · Pedidos</text><text x="98" y="550" class="text">Análises e registrais</text><text x="98" y="578" class="text">criam → cotam → pagam</text><text x="98" y="606" class="text">sem expor Asaas.</text><text x="98" y="654" class="small">analysis:* · registry:*</text><text x="98" y="679" class="small">payment:read</text>
  <rect x="535" y="470" width="330" height="250" class="box"/><text x="563" y="514" class="title">5 · Pagamento</text><text x="563" y="550" class="text">PIX ou créditos</text><text x="563" y="578" class="text">cifra payer ou debita saldo</text><text x="563" y="606" class="text">de forma idempotente.</text><text x="563" y="654" class="small">Cartão/3DS só na plataforma</text><text x="563" y="679" class="small">Sem SHA manual no integrador</text>
  <rect x="1000" y="470" width="330" height="250" class="box"/><text x="1028" y="514" class="title">6 · Webhooks</text><text x="1028" y="550" class="text">Eventos assinados</text><text x="1028" y="578" class="text">teste, rotação e retry</text><text x="1028" y="606" class="text">no painel.</text><text x="1028" y="654" class="small">events:analysis · registry</text><text x="1028" y="679" class="small">payment · connection · ...</text>
  <path d="M350 255 H415" class="line"/><path d="M715 255 H780" class="line"/><path d="M935 360 V415 H235 V470" class="line"/><path d="M935 360 V415 H700 V470" class="line"/><path d="M935 360 V415 H1165 V470" class="line"/>
  <rect x="70" y="785" width="1260" height="62" rx="14" fill="#17233b"/><text x="100" y="824" style="font:700 17px Inter,Arial,sans-serif;fill:#fff">Regra: o token só enxerga recursos originados pela própria aplicação e pela conexão autorizada.</text>
</svg>
